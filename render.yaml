services:
  # =============================================
  # PAYLOAD CMS WEBSITE (replaces Ghost CMS)
  # =============================================
  - type: web
    name: opticwise-payload
    runtime: node
    region: oregon
    plan: starter
    branch: main
    rootDir: payload
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URI
        fromDatabase:
          name: payload-db
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SERVER_URL
        value: https://opticwise-payload.onrender.com
      - key: NEXT_PUBLIC_OW_API_URL
        value: https://ownet.opticwise.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

# =============================================
# DATABASES
# =============================================
databases:
  - name: payload-db
    plan: basic-256mb
    region: oregon
    databaseName: payload_opticwise
    user: payload_user
    ipAllowList: []
